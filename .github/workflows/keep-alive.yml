name: Render Keep Alive Ping

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier from spinning down
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        env:
          RENDER_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          TARGET_URL="${RENDER_URL:-https://laravel-ecommerce-api.onrender.com/api/health}"
          echo "Pinging $TARGET_URL ..."
          curl -s -f -m 30 "$TARGET_URL" || echo "Ping request finished."
